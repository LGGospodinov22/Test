<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Flask Blueprints Demo{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('main.home') }}">Blueprint Demo</a>
    <div class="navbar-nav">
      <a class="nav-link" href="{{ url_for('main.home') }}">Home</a>
      <a class="nav-link" href="{{ url_for('blog.post_list') }}">Blog</a>
      <a class="nav-link" href="{{ url_for('api.health') }}">API Health</a>
    </div>
  </div>
</nav>

<main class="container">
  <header class="mb-3">
    <small class="text-muted">Blueprint: {% block blueprint_name %}unknown{% endblock %}</small>
  </header>
  {% block content %}{% endblock %}
</main>
</body>
</html>
